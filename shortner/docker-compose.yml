services:
  db:
    image: postgres:18.6
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: shortner
      POSTGRES_USER: s_user
      POSTGRES_PASSWORD: s_password
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ stores data in a version-specific directory under this path.
      - postgres_data:/var/lib/postgresql
  cache:
    image: redis:8
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lfu"]
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
