spring.application.name=api-gateway
server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Upstream service
app.rate-limit.upstream=http://${SHORTNER_HOST:localhost}:${SHORTNER_PORT:8081}

# Rate limiting (coarse, per client IP, enforced at the edge)
# Supply the complete Redis URI from deployment configuration, including
# credentials and rediss:// when the managed Redis endpoint requires TLS.
app.rate-limit.redis-uri=${GATEWAY_REDIS_URI}
app.rate-limit.redis-timeout=200ms
# The gateway is the edge: only enable this behind a proxy that overwrites X-Forwarded-For.
app.rate-limit.trust-forwarded-for=false
app.rate-limit.create.capacity=20
app.rate-limit.create.period=1m
app.rate-limit.redirect.capacity=1200
app.rate-limit.redirect.period=1m
