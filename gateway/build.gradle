plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.custom'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.3")
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
	// Rate limiting: the gateway's Bucket4jFilterFunctions needs these on the classpath.
	// Keep bucket4j_jdk17-core pinned to the version the gateway compiles against (8.15.0).
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.15.0'
	implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.15.0'
	implementation 'io.lettuce:lettuce-core'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

apply from: rootProject.file('../gradle/env-profile.gradle')
